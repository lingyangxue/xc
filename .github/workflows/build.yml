name: Build ClownFeature
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: 安装 Theos 与依赖
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          brew install dpkg ldid xz || true

      - name: 编译并打包
        run: |
          cd ClownFeature/ClownFeature
          echo "THEOS=$THEOS"
          make package FINALPACKAGE=1 2>&1 | tee build.log
          ls -la packages/

      - name: 上传 deb 产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ClownFeature-deb
          path: ClownFeature/ClownFeature/packages/*.deb

      - name: 上传日志以供分析
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: ClownFeature/ClownFeature/build.log
